name: Security Audit

# Security scanning workflow for the social-media automation project
# Runs on push, pull request, and weekly schedule

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'automation/social-media/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'automation/social-media/**'
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/social-media

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          echo "Running npm audit..."
          npm audit --json > audit-results.json 2>&1 || true
          
          # Parse results
          AUDIT_EXIT_CODE=$?
          VULN_COUNT=$(jq '.metadata.vulnerabilities.total' audit-results.json 2>/dev/null || echo "0")
          CRITICAL_COUNT=$(jq '.metadata.vulnerabilities.critical' audit-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '.metadata.vulnerabilities.high' audit-results.json 2>/dev/null || echo "0")
          MODERATE_COUNT=$(jq '.metadata.vulnerabilities.moderate' audit-results.json 2>/dev/null || echo "0")
          
          echo "vulnerabilities=${VULN_COUNT}" >> $GITHUB_OUTPUT
          echo "critical=${CRITICAL_COUNT}" >> $GITHUB_OUTPUT
          echo "high=${HIGH_COUNT}" >> $GITHUB_OUTPUT
          echo "moderate=${MODERATE_COUNT}" >> $GITHUB_OUTPUT
          echo "exit_code=${AUDIT_EXIT_CODE}" >> $GITHUB_OUTPUT
          
          # Print summary
          echo ""
          echo "=== Security Audit Summary ==="
          echo "Total Vulnerabilities: ${VULN_COUNT}"
          echo "Critical: ${CRITICAL_COUNT}"
          echo "High: ${HIGH_COUNT}"
          echo "Moderate: ${MODERATE_COUNT}"
          echo "=================================="
          
          # Show details if vulnerabilities exist
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo ""
            echo "Details:"
            jq '.vulnerabilities | keys[]' audit-results.json 2>/dev/null || echo "Unable to parse details"
          fi

      - name: Check for critical/high vulnerabilities
        if: steps.audit.outputs.critical != '0' || steps.audit.outputs.high != '0'
        run: |
          echo "::error::CRITICAL/HIGH vulnerabilities detected!"
          echo "Critical: ${{ steps.audit.outputs.critical }}"
          echo "High: ${{ steps.audit.outputs.high }}"
          echo ""
          echo "Please address these vulnerabilities before merging."
          exit 1

      - name: Warn about moderate vulnerabilities
        if: steps.audit.outputs.moderate != '0'
        run: |
          echo "::warning::MODERATE vulnerabilities detected (${{ steps.audit.outputs.moderate }})"
          echo "Consider addressing these in a follow-up PR."

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: automation/social-media/audit-results.json
          retention-days: 7

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: automation/social-media

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || true
          
          # Count outdated packages
          OUTDATED_COUNT=$(npm outdated 2>/dev/null | grep -v "^Package" | grep -v "^$" | wc -l)
          echo "Outdated packages: ${OUTDATED_COUNT}"
          
          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "::warning::${OUTDATED_COUNT} outdated dependencies detected"
            echo "Consider updating in a follow-up PR"
          fi

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: automation/social-media

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install form-data for tests
        run: npm install form-data

      - name: Run API client tests
        id: tests
        run: |
          echo "Running API client tests..."
          npm test || true
          TEST_EXIT_CODE=$?
          echo "exit_code=${TEST_EXIT_CODE}" >> $GITHUB_OUTPUT
          
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ All tests passed"
          else
            echo "❌ Some tests failed"
          fi

      - name: Fail if tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::API client tests failed!"
          exit 1

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [security-audit, test-suite]
    defaults:
      run:
        working-directory: automation/social-media

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for deprecated packages
        run: |
          echo "Checking for deprecated packages..."
          DEPRECATED=$(npm ls 2>/dev/null | grep "deprecated" | wc -l)
          
          if [ "$DEPRECATED" -gt 0 ]; then
            echo "::warning::Deprecated packages detected"
            npm ls | grep "deprecated"
          else
            echo "✅ No deprecated packages"
          fi

      - name: Check package-lock.json integrity
        run: |
          echo "Verifying package-lock.json..."
          npm ci --dry-run
          echo "✅ package-lock.json is valid"

  # Weekly security report
  weekly-report:
    name: Weekly Security Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: security-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          name: security-audit-results
          path: automation/social-media

      - name: Generate security report
        run: |
          echo "# Weekly Security Report" > SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "**Date:** $(date)" >> SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "## Audit Results" >> SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          
          # Extract data from audit results
          if [ -f automation/social-media/audit-results.json ]; then
            VULN_COUNT=$(jq '.metadata.vulnerabilities.total' automation/social-media/audit-results.json)
            CRITICAL=$(jq '.metadata.vulnerabilities.critical' automation/social-media/audit-results.json)
            HIGH=$(jq '.metadata.vulnerabilities.high' automation/social-media/audit-results.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate' automation/social-media/audit-results.json)
            
            echo "| Metric | Count |" >> SECURITY_REPORT.md
            echo "|--------|-------|" >> SECURITY_REPORT.md
            echo "| Total | $VULN_COUNT |" >> SECURITY_REPORT.md
            echo "| Critical | $CRITICAL |" >> SECURITY_REPORT.md
            echo "| High | $HIGH |" >> SECURITY_REPORT.md
            echo "| Moderate | $MODERATE |" >> SECURITY_REPORT.md
          else
            echo "No audit results available" >> SECURITY_REPORT.md
          fi
          
          echo "" >> SECURITY_REPORT.md
          echo "## Recommendations" >> SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "1. Address any critical/high vulnerabilities immediately" >> SECURITY_REPORT.md
          echo "2. Review moderate vulnerabilities for relevance" >> SECURITY_REPORT.md
          echo "3. Update dependencies regularly" >> SECURITY_REPORT.md
          
          cat SECURITY_REPORT.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-security-report
          path: SECURITY_REPORT.md
          retention-days: 30
