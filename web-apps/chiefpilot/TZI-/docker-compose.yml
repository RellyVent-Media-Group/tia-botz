version: '3.8'

services:
  chiefpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chiefpilot-tzi
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=http://localhost:3000
      - WORKSPACE_API_URL=http://localhost:3001
    volumes:
      # Mount dist for development (optional)
      - ./dist:/app/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Development configuration with hot-reload
  chiefpilot-dev:
    image: node:20-alpine
    container_name: chiefpilot-tzi-dev
    working_dir: /app
    ports:
      - "3000:3000"
      - "5173:5173"  # Vite dev server
    environment:
      - NODE_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev
