apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiefpilot-tzi
  labels:
    app: chiefpilot-tzi
    version: v1.0.0
    component: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chiefpilot-tzi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chiefpilot-tzi
        version: v1.0.0
    spec:
      containers:
        - name: chiefpilot-tzi
          image: ghcr.io/${GITHUB_REPOSITORY:-your-org/your-repo}/chiefpilot-tzi:sha-${GITHUB_SHA:-latest}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chiefpilot-secrets
                  key: gemini-api-key
            - name: APP_URL
              value: "https://chiefpilot.your-domain.com"
            - name: WORKSPACE_API_URL
              value: "http://workspace-api:3001"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chiefpilot-tzi
  labels:
    app: chiefpilot-tzi
spec:
  selector:
    app: chiefpilot-tzi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chiefpilot-tzi-ingress
  labels:
    app: chiefpilot-tzi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PUT, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*',
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE',
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization',
        add_header 'Access-Control-Max-Age' 1728000,
        add_header 'Content-Type' 'text/plain; charset=utf-8',
        add_header 'Content-Length' 0,
        return 204;
      }
spec:
  tls:
    - hosts:
        - chiefpilot.your-domain.com
      secretName: chiefpilot-tzi-tls
  rules:
    - host: chiefpilot.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chiefpilot-tzi
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chiefpilot-tzi-hpa
  labels:
    app: chiefpilot-tzi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chiefpilot-tzi
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
