apiVersion: v1
kind: Secret
metadata:
  name: chiefpilot-secrets
  labels:
    app: chiefpilot-tzi
    type: secrets
stringData:
  # Google Gemini API Key
  gemini-api-key: "YOUR_GEMINI_API_KEY"
  
  # Optional: Additional secrets for external services
  # workspace-api-key: "YOUR_WORKSPACE_API_KEY"
  # database-url: "YOUR_DATABASE_URL"
---
# To create the actual secret, run:
# kubectl apply -f k8s/secrets.yml
#
# Or create from literal:
# kubectl create secret generic chiefpilot-secrets \
#   --from-literal=gemini-api-key='YOUR_API_KEY'
