<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA'K_ZU.0 AI Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #0a0d10;
color: #f4efe4;
}
.role-button {
transition: all 0.2s ease;
}
.role-button:hover {
transform: scale(1.05);
box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
}
.role-button:active {
transform: scale(0.98);
}
.log-entry {
animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(-5px); }
to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
<div class="w-full max-w-4xl bg-[#12171d] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-[#181f27]">
<!-- Header Section -->
<div class="bg-[#181f27] p-6 text-center rounded-t-3xl">
<h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-[#f4efe4] mb-2">
TA'K_ZU.0 AI Assistant 🤖
</h1>
<p class="text-sm sm:text-base text-[#aeb4b7]">
Powered up, <span id="user-name">Ta'K</span>! Let's build something epic.
</p>
</div>

<!-- Main Content Area -->
<div class="flex flex-col md:flex-row flex-1 p-6 gap-6">
<!-- Controls Panel -->
<div class="md:w-1/2 flex flex-col gap-4">
<h2 class="text-xl font-semibold mb-2 text-[#f4efe4]">Activate Expert Role:</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="role-buttons">
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="architect">
Chief Architect
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="code_king">
Code King
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="ux_maestro">
UX/UI Maestro
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="security_guardian">
Security Guardian
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="prompt_alchemist">
Content Alchemist
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="qa_commander">
QA Commander
</button>
<button class="role-button bg-[#8acbd2] text-[#0a0d10] rounded-xl py-3 px-4 font-medium focus:outline-none focus:ring-2 focus:ring-[#8acbd2] focus:ring-opacity-50 shadow-lg" data-role="teaching_facilitator">
Teaching Facilitator
</button>
</div>
</div>

<!-- Output and Log Panel -->
<div class="md:w-1/2 flex flex-col bg-[#0a0d10] rounded-xl p-4 border border-[#181f27]">
<h2 class="text-xl font-semibold mb-2 text-[#f4efe4]">Console Output:</h2>
<div class="flex-1 overflow-y-auto font-mono text-sm text-[#aeb4b7] p-2 space-y-2" id="log-container">
<div class="text-[#aeb4b7] text-center py-8">
Click a button to start the simulation.
</div>
</div>
</div>
</div>

<!-- Footer with conceptual output -->
<div class="bg-[#181f27] p-4 text-center text-[#aeb4b7] rounded-b-3xl border-t border-[#181f27]">
<p class="font-semibold text-[#f4efe4]">Current Action Output:</p>
<p class="italic" id="current-output">No action active</p>
</div>
</div>

<script>
const roles = {
architect: { name: 'Chief Architect', action: 'Designing a robust system architecture.' },
code_king: { name: 'Code King', action: 'Writing optimized, cutting-edge code.' },
ux_maestro: { name: 'UX/UI Maestro', action: 'Crafting an intuitive user experience.' },
security_guardian: { name: 'Security Guardian', action: 'Implementing iron-clad security protocols.' },
prompt_alchemist: { name: 'Content Alchemist', action: 'Brewing a compelling and engaging prompt.' },
qa_commander: { name: 'QA Commander', action: 'Debugging and ensuring top-tier quality.' },
teaching_facilitator: { name: 'Teaching Facilitator', action: 'Creating crystal-clear documentation.' }
};

const logContainer = document.getElementById('log-container');
const currentOutput = document.getElementById('current-output');
const roleButtons = document.querySelectorAll('.role-button');

function addToLog(message) {
const entry = document.createElement('div');
entry.className = 'log-entry flex items-start';
const timestamp = new Date().toLocaleTimeString();
entry.innerHTML = `<span class="text-[#aeb4b7] mr-2 flex-shrink-0">[${timestamp}]</span><span class="break-words w-full">${message}</span>`;
logContainer.appendChild(entry);
logContainer.scrollTop = logContainer.scrollHeight;
}

function activateRole(roleKey) {
const role = roles[roleKey];
currentOutput.textContent = '';
addToLog(`[TA'K_ZU.0] Activating role: ${role.name}`);

setTimeout(() => {
const outputMessage = `As your ${role.name}, I am now ${role.action}`;
currentOutput.textContent = outputMessage;
addToLog(`[TA'K_ZU.0] ${outputMessage}`);
}, 500);
}

roleButtons.forEach(button => {
button.addEventListener('click', () => {
const roleKey = button.dataset.role;
activateRole(roleKey);
});
});

// Initial greeting
setTimeout(() => {
addToLog('[TA\'K_ZU.0] System initialized. Ready for instructions.');
}, 500);
</script>
</body>
</html>
