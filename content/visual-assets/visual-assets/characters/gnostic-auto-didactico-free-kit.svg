<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gnostic Auto-Didactico free local character kit</title>
  <desc id="desc">A portfolio-style poster sheet with character cards and a text banner showing the local workaround.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="55%" stop-color="#131a22"/>
      <stop offset="100%" stop-color="#17130c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6d075"/>
      <stop offset="100%" stop-color="#ad7f2d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fe8d5"/>
      <stop offset="100%" stop-color="#1a7d7d"/>
    </linearGradient>
    <style>
      .label { font: 700 18px 'Arial', sans-serif; letter-spacing: 3px; fill: #dfe8f5; }
      .title { font: 800 44px 'Arial Black', 'Arial', sans-serif; fill: #f2f4f7; }
      .small { font: 700 12px 'Arial', sans-serif; letter-spacing: 2px; fill: #a9b7c8; }
      .name { font: 700 22px 'Arial', sans-serif; fill: #f4f1e8; }
      .role { font: 700 11px 'Arial', sans-serif; letter-spacing: 2px; fill: #7ee6d2; }
      .desc { font: 400 13px 'Arial', sans-serif; fill: #d3d9df; }
