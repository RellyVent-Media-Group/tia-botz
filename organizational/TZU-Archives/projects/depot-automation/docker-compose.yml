version: '3.8'

services:
  depot-automation:
    build: .
    container_name: tiapmaatzu-depot-automation
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
    ports:
      - "8000:8000"
    networks:
      - depot-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a database service for persistent storage
  # postgres:
  #   image: postgres:13
