  #     - POSTGRES_PASSWORD=depot_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - depot-network

  # Optional: Add Redis for caching and task queues
  # redis:
  #   image: redis:6-alpine
  #   container_name: depot-redis
  #   restart: unless-stopped
  #   networks:
  #     - depot-network

networks:
  depot-network:
    driver: bridge

