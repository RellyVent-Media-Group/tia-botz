<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer - Holdings Depot</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">&larr; Back to Portal</a>
            <h1 id="docTitle">Document Viewer</h1>
        </header>

        <div id="content" class="markdown-content">
            <p>Loading document...</p>
        </div>

        <footer>
            <p>&copy; 2026 Holdings Depot (TZI.HLD.DEP.GNOSIS) | Oracle/TIAPMAATZU</p>
        </footer>
    </div>

    <script>
        const titleMap = {
            'operations-manual.md': 'Operations Manual',
            'guides/automation-setup-guide.md': 'Automation Setup Guide',
            'guides/partner-depot-integration-guide.md': 'Partner Depot Integration Guide',
            'guides/deployment-checklist.md': 'Deployment Checklist',
            'reports/executive-summary-report.md': 'Executive Summary Report',
            'reports/performance-metrics-report.md': 'Performance Metrics Report',
            'DEPLOYMENT_SUMMARY.md': 'Deployment Summary'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file') || 'operations-manual.md';

        // Set document title
        document.getElementById('docTitle').textContent = titleMap[fileName] || fileName;

        // Fetch and render markdown
        fetch(fileName)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Document not found');
                }
                return response.text();
            })
            .then(markdown => {
                document.getElementById('content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Document</h2>
                        <p>${error.message}</p>
                        <p><a href="index.html">Return to Portal</a></p>
                    </div>
                `;
            });
    </script>
</body>
</html>
