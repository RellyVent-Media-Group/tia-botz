# ========================================
# HOLDINGS DEPOT AUTOMATION CRON JOBS
# ========================================
#
# Installation Instructions:
# 1. Update the paths below to match your actual directory structure
# 2. Update the path to your Python virtual environment
# 3. Run: crontab crontab.conf
# 4. Verify with: crontab -l
#
# ========================================

# Set PATH and working directory
PATH=/usr/local/bin:/usr/bin:/bin
SHELL=/bin/bash
TZ=UTC

# Set working directory (UPDATE THIS PATH)
# Replace with your actual path to the automation directory
# Example: /Users/jypsee72/Desktop/Tiapmaatzu-OS-Toolkit/organizational/TZU-Archives/documentation/depot-operations/holdings-depot/automation
HOLDINGS_DEPOT_PATH=/path/to/holdings-depot/automation

# Python virtual environment path (UPDATE THIS PATH)
# Example: /Users/jypsee72/Desktop/Tiapmaatzu-OS-Toolkit/organizational/TZU-Archives/documentation/depot-operations/holdings-depot/automation/venv/bin/python
PYTHON_BIN=/path/to/venv/bin/python

# ========================================
# AUTOMATION SCHEDULES
# ========================================

# Portfolio Rebalancing - Weekly on Friday at 4 PM UTC
# Rebalances portfolio based on target allocations
0 16 * * 5 cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN portfolio_rebalancing.py >> logs/cron_rebalancing.log 2>&1

# Resource Allocation - Daily at 9 AM UTC
# Allocates resources across depots based on priorities
0 9 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN resource_allocation.py >> logs/cron_allocation.log 2>&1

# Risk Monitoring - Every 5 minutes
# Monitors portfolio risk and generates alerts
*/5 * * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN risk_monitoring.py >> logs/cron_risk.log 2>&1

# Daily Reports - Every day at 6 PM UTC
# Generates daily performance and status reports
0 18 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN generate_reports.py >> logs/cron_reports.log 2>&1

# ========================================
# MAINTENANCE SCHEDULES
# ========================================

# Daily Backup - Every day at 2 AM UTC
# Backs up configuration, data, and results
0 2 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN backup.py >> logs/cron_backup.log 2>&1

# Log Rotation - Every day at 1 AM UTC
# Rotates and compresses log files
0 1 * * * cd $HOLDINGS_DEPOT_PATH && find logs/ -name "*.log" -mtime +7 -exec gzip {} \; >> logs/cron_rotation.log 2>&1

# Weekly Maintenance - Every Sunday at 3 AM UTC
# Performs system maintenance and cleanup
0 3 * * 0 cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN maintenance.py >> logs/cron_maintenance.log 2>&1

# ========================================
# MONITORING SCHEDULES
# ========================================

# Health Check - Every minute
# Checks system health and sends alerts if issues detected
* * * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN health_check.py >> logs/cron_health.log 2>&1

# Integration Health Check - Every 15 minutes
# Checks API integration health with partner depots
*/15 * * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN integration_health.py >> logs/cron_integration.log 2>&1

# Performance Monitoring - Every hour
# Monitors system performance and resources
0 * * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN performance_monitor.py >> logs/cron_performance.log 2>&1

# ========================================
# DATA SYNCHRONIZATION
# ========================================

# Depot Data Sync - Every 6 hours
# Synchronizes data with partner depots
0 */6 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN sync_depot_data.py >> logs/cron_sync.log 2>&1

# Market Data Sync - Every hour
# Synchronizes market data
0 * * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN sync_market_data.py >> logs/cron_market.log 2>&1

# ========================================
# TESTING AND VALIDATION
# ========================================

# Integration Tests - Daily at 8 AM UTC
# Runs integration tests to verify API connectivity
0 8 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN test_integrations.py >> logs/cron_tests.log 2>&1

# Data Validation - Every 4 hours
# Validates data integrity and consistency
0 */4 * * * cd $HOLDINGS_DEPOT_PATH && $PYTHON_BIN validate_data.py >> logs/cron_validation.log 2>&1

# ========================================
# NOTES
# ========================================
#
# Cron Schedule Format:
# * * * * * command
# │ │ │ │ │
# │ │ │ │ └─ Day of week (0-7, 0 or 7 is Sunday)
# │ │ │ └─── Month (1-12)
# │ │ └───── Day of month (1-31)
# │ └─────── Hour (0-23)
# └───────── Minute (0-59)
#
# Special characters:
# * - Any value
# , - Value list separator
# - - Range of values
# / - Step values
#
# Examples:
# */5 * * * * - Every 5 minutes
# 0 * * * * - Every hour at minute 0
# 0 0 * * * - Every day at midnight
# 0 0 * * 0 - Every Sunday at midnight
# 0 9 * * 1-5 - Every weekday at 9 AM
#
# ========================================
